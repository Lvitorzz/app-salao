name: gestao_salao
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  intl: ^0.19.0
  collection: ^1.18.0
  fl_chart: ^0.68.0
  multi_select_flutter: ^4.1.3
  firebase_core: ^2.10.0
  cloud_firestore: ^4.17.5
  url_launcher: ^6.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.10.0

# Configuração para gerar o ícone do app
flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/app_icon.jpg"

flutter:
  uses-material-design: true

  # (caso queira usar a imagem do ícone em widgets dentro do app)
  # assets:
  #   - lib/assets/icon/app_icon.jpg
